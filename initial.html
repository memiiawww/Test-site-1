<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Checker</title>
    <!-- Подключаем TensorFlow.js и библиотеку Teachable Machine -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
    <style>
        /* Базовые стили */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            transition: background-color 0.3s ease;
        }

        /* Контейнер для видео */
        #video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 640px;
            height: 480px;
            border: 8px dashed rgba(255, 255, 255, 0.5);
            border-radius: 30px;
            overflow: hidden;
            z-index: 10;
            box-shadow: 0 0 30px rgba(0,0,0,0.2);
        }

        canvas, video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1); /* Зеркальное отображение */
        }

        /* Текст поверх видео */
        #label-container {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            z-index: 20;
            pointer-events: none;
        }

        /* Заголовок */
        .title {
            position: absolute;
            top: 20px;
            left: 40px;
            font-size: 80px;
            font-weight: 900;
            z-index: 10;
            transition: color 0.3s ease;
            font-family: 'Arial Black', sans-serif;
        }

        /* --- СТИЛИ ДЛЯ ЗЕЛЕНОГО СОСТОЯНИЯ (По умолчанию) --- */
        body.state-green {
            background-color: #e0f7d4; /* Светло-зеленый фон */
        }
        
        body.state-green .title {
            color: #004d40; /* Темно-зеленый текст */
        }

        body.state-green #video-container {
            border-color: #66bb6a; /* Зеленая рамка */
        }

        /* Декоративные элементы (Зеленые) */
        .decor-circle {
            position: absolute;
            border-radius: 50%;
            background: #81c784;
            opacity: 0.6;
            z-index: 1;
        }
        
        /* --- СТИЛИ ДЛЯ КРАСНОГО СОСТОЯНИЯ (Когда "No") --- */
        body.state-red {
            background-color: #000080; /* Темно-синий фон (как на картинке) */
        }

        body.state-red .title {
            color: #ffffff;
        }
        
        /* Красные декоративные элементы */
        body.state-red .decor-triangle {
            position: absolute;
            width: 0;
            height: 0;
            border-style: solid;
            z-index: 1;
        }

        body.state-red #video-container {
            border-color: #ff4500; /* Оранжево-красная рамка */
        }

        /* Анимация появления */
        .fade-in {
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    </style>
</head>
<body class="state-green">

    <!-- Заголовок -->
    <div class="title" id="main-title">Don't cheat!</div>

    <!-- Контейнер для камеры -->
    <div id="video-container">
        <div>Loading model...</div>
    </div>
    
    <!-- Результат -->
    <div id="label-container"></div>

    <!-- Фоновые фигуры (Генерируются скриптом) -->
    <div id="background-layer"></div>

    <script>
        const URL = "./"; // Путь к файлам модели (в той же папке)
        
        let model, webcam, labelContainer, maxPredictions;
        let currentState = 'green';

        // Элементы DOM
        const titleElement = document.getElementById('main-title');
        const bodyElement = document.body;
        const bgLayer = document.getElementById('background-layer');

        // Инициализация фона (геометрические фигуры)
        function initBackground() {
            // Создаем случайные круги и треугольники для фона
            for(let i=0; i<10; i++) {
                const div = document.createElement('div');
                div.classList.add('decor-circle');
                
                // Случайный размер и позиция
                const size = Math.random() * 200 + 50;
                div.style.width = size + 'px';
                div.style.height = size + 'px';
                div.style.left = Math.random() * 90 + '%';
                div.style.top = Math.random() * 90 + '%';
                
                // Цвет зависит от текущей темы (задается через CSS классы body, но тут зададим базовый)
                bgLayer.appendChild(div);
            }
        }

        // Функция загрузки модели
        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            // Загружаем модель
            model = await tmImage.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            // Настраиваем камеру
            const flip = true; // Зеркалить камеру
            webcam = new tmImage.Webcam(640, 480, flip); // width, height, flip
            await webcam.setup(); // Запрос доступа к камере
            await webcam.play();
            window.requestAnimationFrame(loop);

            // Добавляем элементы в DOM
            document.getElementById("video-container").innerHTML = "";
            document.getElementById("video-container").appendChild(webcam.canvas);
            
            labelContainer = document.getElementById("label-container");
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        // Цикл предсказания
        async function loop() {
            webcam.update(); // Обновляем кадр с камеры
            await predict();
            window.requestAnimationFrame(loop);
        }

        // Логика предсказания и смены темы
        async function predict() {
            // Предсказание
            const prediction = await model.predict(webcam.canvas);
            
            let highestProb = 0;
            let bestClass = "";

            // Ищем класс с наибольшей вероятностью
            for (let i = 0; i < maxPredictions; i++) {
                if (prediction[i].probability > highestProb) {
                    highestProb = prediction[i].probability;
                    bestClass = prediction[i].className;
                }
            }

            // Вывод текста в контейнер (для отладки, можно скрыть)
            // labelContainer.innerHTML = `Result: ${bestClass} (${(highestProb*100).toFixed(0)}%)`;

            // ЛОГИКА СМЕНЫ ТЕМЫ
            // Если нейросеть уверена (например, > 60%), что это "No"
            if (bestClass === "No" && highestProb > 0.6) {
                if (currentState !== 'red') {
                    switchToRed();
                }
            } else {
                // Во всех остальных случаях возвращаем зеленый
                if (currentState !== 'green') {
                    switchToGreen();
                }
            }
        }

        function switchToRed() {
            currentState = 'red';
            bodyElement.classList.remove('state-green');
            bodyElement.classList.add('state-red');
            titleElement.textContent = "I see it.";
            
            // Меняем цвета фигур на красные/синие
            const circles = document.querySelectorAll('.decor-circle');
            circles.forEach(c => c.style.background = '#ff0000'); // Красный
        }

        function switchToGreen() {
            currentState = 'green';
            bodyElement.classList.remove('state-red');
            bodyElement.classList.add('state-green');
            titleElement.textContent = "Don't cheat!";

            // Меняем цвета фигур обратно на зеленые
            const circles = document.querySelectorAll('.decor-circle');
            circles.forEach(c => c.style.background = '#81c784'); // Зеленый
        }

        // Запуск
        initBackground();
        init();

    </script>
</body>
</html>
